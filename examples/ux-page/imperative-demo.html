<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fastwebmcp — Imperative API demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
      background: #ffffff;
    }
    h1 { font-size: 1.25rem; }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.5rem 0 1.5rem;
    }
    .badges img { display: block; height: 20px; }
    .status {
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .status--supported {
      background: #e6f4ea;
      color: #1e4620;
      border: 1px solid #86c99a;
    }
    .status--unsupported {
      background: #fdf0e6;
      color: #6b3a12;
      border: 1px solid #e8b489;
    }
    #todo-list {
      padding-left: 1.25rem;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #767676;
      border-radius: 0.25rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: 1px solid #1a1a1a;
      border-radius: 0.25rem;
      background: #1a1a1a;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>fastwebmcp — Imperative API demo</h1>
  <p class="badges">
    <a href="https://www.npmjs.com/package/fastwebmcp"><img src="https://img.shields.io/npm/v/fastwebmcp" alt="npm version"></a>
    <a href="https://github.com/MauricioPerera/fastwebmcp/releases/tag/v0.4.0"><img src="https://img.shields.io/github/v/release/MauricioPerera/fastwebmcp" alt="GitHub release"></a>
    <a href="https://github.com/MauricioPerera/fastwebmcp/blob/main/LICENSE"><img src="https://img.shields.io/npm/l/fastwebmcp" alt="license"></a>
  </p>
  <p id="webmcp-status" class="status">Checking WebMCP support&hellip;</p>

  <ul id="todo-list" aria-label="Todo list"></ul>

  <form id="human-add-form">
    <label for="human-add-input">Add a todo item</label>
    <input type="text" id="human-add-input" name="text" placeholder="Buy milk" required>
    <button type="submit">Add</button>
  </form>

  <script type="module" src="../dist/imperative-demo.js"></script>
</body>
</html>
