<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fastwebmcp-start — Declarative API demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
      background: #ffffff;
    }
    h1 { font-size: 1.25rem; }
    label {
      display: block;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }
    input[type="text"], select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #767676;
      border-radius: 0.25rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid #1a1a1a;
      border-radius: 0.25rem;
      background: #1a1a1a;
      color: #ffffff;
      cursor: pointer;
    }
    #result {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      background: #e6f4ea;
      color: #1e4620;
      border: 1px solid #86c99a;
    }
    #result:empty { display: none; }
  </style>
</head>
<body>
  <p><a href="./index.html">&larr; fastwebmcp-start</a></p>
  <h1>Declarative API demo</h1>
  <p>Annotated via <code>defineDeclarativeTool</code>; submission handled via <code>respondToAgentSubmit</code>.</p>

  <form id="support-form" action="#">
    <label for="firstName">First name</label>
    <input type="text" id="firstName" name="firstName">

    <label for="lastName">Last name</label>
    <input type="text" id="lastName" name="lastName">

    <label for="topic">Topic</label>
    <select id="topic" name="topic" required>
      <option value="Customer happiness team">Return my purchase.</option>
      <option value="Distribution team">Check where my package is.</option>
      <option value="Website support team">Get help on the website.</option>
    </select>

    <button type="submit">Submit</button>
  </form>

  <p id="result" role="status"></p>

  <script type="module" src="./dist/declarative-demo.js"></script>
</body>
</html>
